on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'floor'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # The floor is a constant in DESCRIPTION, so the job that tests it reads
      # the version from there rather than counting back from whatever R is
      # current. An oldrel-N ref would slide off the declared minimum the next
      # time R releases, leaving the claim untested.
      - name: Resolve R version
        id: rversion
        # The Windows runner defaults to PowerShell, which cannot parse this.
        shell: bash
        run: |
          if [ "${{ matrix.config.r }}" = "floor" ]; then
            v=$(grep -oE 'R \(>= *[0-9]+\.[0-9]+(\.[0-9]+)?\)' DESCRIPTION |
                  grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
            if [ -z "$v" ]; then
              echo "DESCRIPTION declares no 'Depends: R (>= x.y)' to test" >&2
              exit 1
            fi
            echo "Declared minimum: $v"
          else
            v='${{ matrix.config.r }}'
          fi
          echo "r=$v" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  lint:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LINTR_ERROR_ON_LINT: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  document:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The decor package is a cpp11 Suggests, needed by cpp_register()
          extra-packages: any::roxygen2, any::decor, local::.

      - name: Regenerate
        run: roxygen2::roxygenise(".")
        shell: Rscript {0}

      - name: Report drift
        run: |
          DRIFT=$(git status --porcelain -- NAMESPACE man)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "Generated documentation is out of date; re-document and commit." >&2
            exit 1
          fi
